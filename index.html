<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>闖關學習區</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=JetBrains+Mono:wght@500;700&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: one-screen app. Stats bar on top, a winding trail of round lesson buttons, tabs at the bottom; lessons open full screen.
     Palette: bright grass green for go/progress, sky blue for "selected", orange for streaks and the mascot's header, gold for cleared lessons. */
  --bg:#FFFFFF; --grid:#FFFFFF; --surface:#FFFFFF; --line:#E3E8E4; --ink:#2F3A33; --muted:#66726A;
  --accent:#3DB54A; --accent-d:#2C8F38; --accent-bg:#E6F7E8;
  --sel:#1E9BE0; --sel-d:#167DB8; --sel-bg:#DFF2FC;
  --stamp:#F08A24; --stamp-d:#C96C10; --stamp-bg:#FFF0DF;
  --gold:#F5B800; --gold-d:#CF9A00; --heart:#E5484D;
  --ok:#279036; --ok-d:#1D6E29; --ok-bg:#DDF5DF;
  --bad:#D93A3F; --bad-bg:#FFE3E3; --warn:#8A5A00; --warn-bg:#FFF1CC;
  --lock:#E3E8E4; --code-bg:#1C2620; --code-ink:#DDE8E0;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --display:"Baloo 2","Noto Sans TC","PingFang TC",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#14191E; --grid:#14191E; --surface:#1C242B; --line:#33404A; --ink:#EEF3F0; --muted:#A6B3AC;
  --accent:#58C766; --accent-d:#3A9A47; --accent-bg:#1D3324;
  --sel:#48B4F0; --sel-d:#2C88BD; --sel-bg:#173246;
  --stamp:#FF9E45; --stamp-d:#C46F1E; --stamp-bg:#3A2A18;
  --gold:#FFC933; --gold-d:#C99A10; --heart:#FF6B6F;
  --ok:#5FD070; --ok-d:#3A9A47; --ok-bg:#17311D;
  --bad:#FF7A7E; --bad-bg:#3A1F22; --warn:#E5B54A; --warn-bg:#3A2E12;
  --lock:#2A343C; --code-bg:#0E1411; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14191E; --grid:#14191E; --surface:#1C242B; --line:#33404A; --ink:#EEF3F0; --muted:#A6B3AC;
  --accent:#58C766; --accent-d:#3A9A47; --accent-bg:#1D3324;
  --sel:#48B4F0; --sel-d:#2C88BD; --sel-bg:#173246;
  --stamp:#FF9E45; --stamp-d:#C46F1E; --stamp-bg:#3A2A18;
  --gold:#FFC933; --gold-d:#C99A10; --heart:#FF6B6F;
  --ok:#5FD070; --ok-d:#3A9A47; --ok-bg:#17311D;
  --bad:#FF7A7E; --bad-bg:#3A1F22; --warn:#E5B54A; --warn-bg:#3A2E12;
  --lock:#2A343C; --code-bg:#0E1411; color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.6}
body{background-color:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--sel);outline-offset:2px}
svg{display:block}
a{color:var(--accent)}
code{font-family:var(--mono);font-size:.92em}
b{font-weight:900}
#app{height:100%;display:flex;flex-direction:column;max-width:600px;margin:0 auto}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));background:var(--surface);border-bottom:1px solid var(--line)}
.topic-btn{display:flex;flex-direction:column;align-items:flex-start;min-height:44px;min-width:0;padding:2px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);text-align:left}
.topic-btn small{font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--muted);line-height:1.3}
.topic-btn b{font-size:15px;line-height:1.3}
.stats{display:flex;gap:12px;flex:none}
.stat{display:flex;align-items:center;gap:3px;font-family:var(--display);font-weight:800;font-size:16px;font-variant-numeric:tabular-nums}
.stat svg{width:18px;height:18px;color:var(--stamp)}
.main{flex:1;overflow-y:auto;overflow-x:hidden;padding:14px max(16px,env(safe-area-inset-right,0px)) 36px max(16px,env(safe-area-inset-left,0px))}
.tabbar{display:flex;border-top:1px solid var(--line);background:var(--surface)}
.tab{flex:1;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;background:none;border:0;font-size:12px;font-weight:700;color:var(--muted)}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--accent)}
.tab{font-family:var(--display);font-weight:800}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:14px;border:0;font-family:var(--display);font-weight:800;font-size:16px;letter-spacing:.03em;background:var(--accent);color:var(--surface);box-shadow:0 4px 0 var(--accent-d)}
.btn:active:not(:disabled),.btn.press:not(:disabled){transform:translateY(4px);box-shadow:none}
.hzb{position:relative}
.hz{position:absolute;inset:0;width:100%;height:100%;margin:0;padding:0;opacity:.011;cursor:pointer;z-index:1}
.btn:disabled{background:var(--lock);color:var(--muted);box-shadow:none;cursor:default}
.btn.ok{background:var(--ok);box-shadow:0 4px 0 var(--ok-d)}
.btn.bad{background:var(--bad);box-shadow:0 4px 0 #A82A2E}
.btn.ghost{background:var(--surface);color:var(--sel);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn.wide{width:100%}

.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px}
.card h3{margin:0;font-size:15px;font-weight:900}
.muted{color:var(--muted)}
.small{font-size:13px}
.sync{margin-top:6px}.sync.bad{color:var(--bad)}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.1em;color:var(--muted)}
.bar{height:10px;border-radius:99px;background:var(--lock);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .4s}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:12px}

/* trail */
.unit{border-radius:14px;padding:12px 16px;color:var(--surface);background:var(--accent);box-shadow:0 4px 0 var(--accent-d);margin:6px 0 32px}
.unit.must small::after{content:"必考";margin-left:8px;padding:0 7px;border-radius:99px;background:var(--gold);color:var(--ink);font-family:var(--body);font-weight:900;letter-spacing:0}
.unit small{display:block;font-family:var(--mono);font-size:12px;letter-spacing:.06em;opacity:.92}
.unit b{display:block;font-size:17px;font-weight:900;margin-top:1px;text-wrap:balance}
.unit span{display:block;font-size:13px;opacity:.95;margin-top:2px}
.path{display:flex;flex-direction:column;align-items:center;gap:30px;margin-bottom:30px}
.nrow{position:relative;transform:translateX(var(--off));display:flex;flex-direction:column;align-items:center;width:150px}
.node{width:66px;height:62px;border-radius:50%;background:var(--lock);border:0;box-shadow:0 6px 0 var(--line);color:var(--muted);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:20px;position:relative}
.node.cur{background:var(--accent);color:var(--surface);box-shadow:0 6px 0 var(--accent-d)}
.node.done{background:var(--gold);color:var(--surface);box-shadow:0 6px 0 var(--gold-d)}
.node.exam{border-radius:18px}
.node svg{width:26px;height:26px}
.bubble{position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);white-space:nowrap;background:var(--surface);color:var(--accent);border:2px solid var(--line);font-weight:900;font-size:12px;padding:1px 9px;border-radius:10px}
.nlabel{text-align:center;font-size:13px;font-weight:700;color:var(--ink);margin-top:5px;line-height:1.3;text-wrap:balance}
.nscore{font-family:var(--display);font-weight:800;font-size:13px;color:var(--gold-d)}

/* sheet */
#sheet{position:fixed;inset:0;z-index:50;display:none}
#sheet.on{display:block}
.sbg{position:absolute;inset:0;background:rgba(0,0,0,.45)}
.spanel{position:absolute;left:0;right:0;bottom:0;max-width:600px;max-height:85%;overflow-y:auto;margin:0 auto;background:var(--surface);border-radius:16px 16px 0 0;padding:18px 16px calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
.spanel h2{margin:0;font-size:18px;font-weight:900;text-wrap:balance}
.sacts{display:flex;flex-direction:column;gap:10px}
.topic-opt{display:flex;flex-direction:column;gap:3px;text-align:left;padding:10px 12px;min-height:56px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.topic-opt.on{border:2px solid var(--sel);background:var(--sel-bg)}

/* lesson */
#lesson{position:fixed;inset:0;z-index:40;display:none;background:var(--bg)}
#lesson.on{display:block}
.lwrap{height:100%;max-width:600px;margin:0 auto;display:flex;flex-direction:column;background:var(--surface);border-inline:1px solid var(--line)}
.lhead{display:flex;align-items:center;gap:12px;padding:calc(10px + env(safe-area-inset-top)) 14px 6px}
.x{background:none;border:0;color:var(--muted);width:44px;height:44px;display:grid;place-items:center;flex:none;margin:-6px}
.x svg{width:22px;height:22px}
.pbar{flex:1;height:16px;border-radius:99px;background:var(--lock);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.hearts{display:flex;align-items:center;gap:3px;color:var(--heart);font-family:var(--display);font-weight:800;font-size:17px;flex:none}
.hearts svg{width:22px;height:22px}
.combo{font-weight:900;color:var(--stamp);font-size:13px;min-height:20px;padding:0 16px}
.lbody{flex:1;overflow-y:auto;padding:6px 16px 16px;display:flex;flex-direction:column;gap:12px}
.prompt{font-size:17px;font-weight:900;margin:0;line-height:1.45}
.prompt.en{font-size:15px;font-weight:700}
.stem{border-left:4px solid var(--accent);background:var(--stamp-bg);border-radius:10px;padding:8px 12px;font-size:13px;line-height:1.5}
.stem summary{font-weight:900;font-size:12px;color:var(--muted);cursor:pointer;min-height:28px;display:flex;align-items:center}
.stem .sbody{max-height:34vh;overflow:auto;margin-top:4px}
.tag{align-self:flex-start;font-family:var(--mono);font-size:12px;letter-spacing:.04em;color:var(--muted)}
.flag{display:inline-block;font-family:var(--body);font-size:12px;font-weight:700;color:var(--warn);border:1px solid var(--warn);border-radius:99px;padding:0 7px;margin-left:6px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:center;gap:10px;text-align:left;width:100%;min-height:52px;padding:8px 14px;border-radius:14px;border:2px solid var(--line);box-shadow:0 3px 0 var(--line);background:var(--surface);font-size:14px;font-weight:700}
.opt .k{flex:none;min-width:26px;height:26px;padding:0 4px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;font-size:12px;color:var(--muted);font-family:var(--mono)}
.opt.sel{border-color:var(--sel);box-shadow:0 3px 0 var(--sel);background:var(--sel-bg);color:var(--sel)}
.opt.ok{border-color:var(--ok);box-shadow:0 3px 0 var(--ok);background:var(--ok-bg);color:var(--ok)}
.opt.bad{border-color:var(--bad);box-shadow:0 3px 0 var(--bad);background:var(--bad-bg);color:var(--bad)}
.intro{border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.intro h3{margin:0;font-size:16px;font-weight:900}
.formula{display:block;background:var(--code-bg);color:var(--code-ink);border-radius:8px;padding:8px 12px;font-family:var(--mono);font-size:13px;overflow-x:auto;white-space:pre-wrap;margin:2px 0}
.expr{display:block;background:var(--code-bg);color:var(--code-ink);border-radius:8px;padding:8px 12px;font-family:var(--mono);font-size:13px;overflow-x:auto;white-space:pre-wrap;margin:6px 0}
.tw{overflow-x:auto;margin:6px 0}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{border:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}
th{background:var(--accent-bg)}
.ansline{min-height:56px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start;padding-bottom:8px}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tile{min-width:44px;min-height:46px;padding:0 12px;border-radius:12px;border:2px solid var(--line);box-shadow:0 3px 0 var(--line);background:var(--surface);font-family:var(--mono);font-weight:700;font-size:14px}
.tile.used{color:transparent;background:var(--lock);box-shadow:none;border-color:var(--lock)}
.tinput{width:100%;min-height:50px;font-family:var(--mono);font-weight:700;font-size:16px;padding:10px 12px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
.tinput:focus{border-color:var(--sel);outline:none}
.hint{font-family:var(--mono);font-size:14px;letter-spacing:2px;color:var(--muted);word-break:break-word}
.linkbtn{align-self:flex-start;min-height:44px;background:none;border:0;padding:0;color:var(--accent);font-weight:700;font-size:13px}
.match{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mcol{display:flex;flex-direction:column;gap:8px;min-width:0}
.mt{min-height:56px;padding:6px 8px;border-radius:14px;border:2px solid var(--line);box-shadow:0 3px 0 var(--line);background:var(--surface);font-weight:700;font-size:13px;line-height:1.3;word-break:break-word}
.mt.sel{border-color:var(--sel);box-shadow:0 3px 0 var(--sel);background:var(--sel-bg);color:var(--sel)}
.mt.gone{opacity:.35;box-shadow:none;background:var(--ok-bg);border-color:var(--ok)}
.mt.bad{border-color:var(--bad);background:var(--bad-bg);color:var(--bad);animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
/* guide */
.goal{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:var(--stamp-bg);font-weight:700;font-size:14px;line-height:1.5}
.goal svg{width:22px;height:22px;color:var(--stamp);flex:none;margin-top:2px}
.gnotes{display:flex;flex-direction:column;gap:4px;padding:8px 10px;border-left:3px solid var(--ok);background:var(--ok-bg);border-radius:0 10px 10px 0}
.gnotes:empty{display:none}
.gn{display:flex;gap:6px;align-items:flex-start;font-size:13px;font-weight:700;color:var(--ok)}
.gn svg{width:16px;height:16px;flex:none;margin-top:3px}
.gstep{font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.06em}
.gfb{border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.6;display:flex;flex-direction:column;gap:6px;animation:rise .24s ease-out}
.gfb.ok{background:var(--ok-bg)}.gfb.bad{background:var(--bad-bg)}
.gfb .t{font-size:15px;font-weight:900}.gfb.ok .t{color:var(--ok)}.gfb.bad .t{color:var(--bad)}
/* ask AI */
.askai{display:none;align-self:flex-start;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:99px;border:2px solid var(--sel);background:var(--surface);color:var(--sel);font-weight:800;font-size:13px}
html.ai .askai{display:inline-flex}
.askai svg{width:17px;height:17px}
#chat{position:fixed;inset:0;z-index:60;display:none}
#chat.on{display:block}
.cpanel{position:absolute;left:0;right:0;bottom:0;max-width:600px;height:88%;margin:0 auto;background:var(--surface);border-radius:16px 16px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom);animation:rise .2s ease-out}
.chead{display:flex;align-items:center;justify-content:space-between;padding:10px 16px 4px}
.chead b{font-size:17px;font-weight:900}
.cctx{margin:0 16px;border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:13px}
.cctx summary{cursor:pointer;font-weight:700;color:var(--muted);min-height:28px}
.cctx div{white-space:pre-wrap;max-height:28vh;overflow:auto;margin-top:6px;color:var(--muted)}
.cmsgs{flex:1;overflow-y:auto;padding:10px 16px;display:flex;flex-direction:column;gap:10px}
.cmsg{max-width:88%;padding:8px 12px;border-radius:14px;font-size:14px;line-height:1.65;word-break:break-word}
.cmsg.u{align-self:flex-end;background:var(--sel);color:#fff;border-bottom-right-radius:4px}
.cmsg.a{align-self:flex-start;background:var(--bg);border:1px solid var(--line);border-bottom-left-radius:4px}
.cmsg.a code{background:var(--code-bg);color:var(--code-ink);padding:1px 5px;border-radius:5px}
.cmsg.err{color:var(--bad);border-color:var(--bad)}
.cquick{display:flex;gap:6px;overflow-x:auto;padding:0 16px 6px}
.cquick button{flex:none;min-height:36px;padding:0 12px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:13px;font-weight:700}
.cform{display:flex;gap:8px;padding:6px 16px 6px;align-items:flex-end}
.cform textarea{flex:1;min-width:0;min-height:44px;max-height:120px;resize:none;font:inherit;font-size:16px;line-height:1.4;padding:10px 12px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
.cform textarea:focus{border-color:var(--sel);outline:none}
.cform .btn{min-height:44px;padding:0 16px;font-size:15px;flex:none}
.cnote{padding:0 16px 8px}
@media (min-width:900px){.cmsg{font-size:15.5px}}
/* sort */
.pool{display:flex;flex-wrap:wrap;gap:8px;min-height:56px;padding:8px;border:2px dashed var(--line);border-radius:14px;align-items:center}
.chip{min-height:44px;padding:4px 12px;border-radius:12px;border:2px solid var(--line);box-shadow:0 3px 0 var(--line);background:var(--surface);font-weight:700;font-size:14px;text-align:left;line-height:1.35}
.chip.sel{border-color:var(--sel);box-shadow:0 3px 0 var(--sel);background:var(--sel-bg);color:var(--sel)}
.chip.ok{border-color:var(--ok);box-shadow:0 3px 0 var(--ok);background:var(--ok-bg);color:var(--ok)}
.chip.bad{border-color:var(--bad);box-shadow:0 3px 0 var(--bad);background:var(--bad-bg);color:var(--bad)}
.bks{display:flex;flex-direction:column;gap:8px}
.bk{border:2px solid var(--line);border-radius:14px;padding:6px;display:flex;flex-direction:column;gap:6px;background:var(--bg);transition:border-color .15s}
.bk.ready{border-color:var(--sel)}
.bkh{min-height:44px;border:0;border-radius:10px;background:var(--accent-bg);color:var(--ink);font-weight:900;font-size:14px;text-align:left;padding:0 12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.bkp{font-size:12px;font-weight:700;color:var(--muted);opacity:0;transition:opacity .15s}
.bk.ready .bkh{background:var(--sel-bg);color:var(--sel)}
.bk.ready .bkp{opacity:1;color:var(--sel)}
.bkc{display:flex;flex-wrap:wrap;gap:6px}
.bkc:empty{display:none}
/* drag */
.drl{display:flex;flex-direction:column;gap:8px}
.dr{display:flex;align-items:center;gap:6px;min-height:52px;padding:4px 4px 4px 8px;border-radius:14px;border:2px solid var(--line);box-shadow:0 3px 0 var(--line);background:var(--surface);font-weight:700;font-size:14px;line-height:1.35;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:grab;transition:transform .15s}
.dr.lift{transition:none;position:relative;z-index:2;border-color:var(--sel);box-shadow:0 10px 20px rgba(0,0,0,.2);background:var(--sel-bg);color:var(--sel);cursor:grabbing}
.dr.ok{border-color:var(--ok);box-shadow:0 3px 0 var(--ok);background:var(--ok-bg);color:var(--ok)}
.dr.bad{border-color:var(--bad);box-shadow:0 3px 0 var(--bad);background:var(--bad-bg);color:var(--bad)}
.drh{flex:none;color:var(--muted)}
.drh svg{width:18px;height:18px}
.drt{flex:1;min-width:0}
.dra{flex:none;width:40px;height:40px;border-radius:10px;border:0;background:var(--bg);color:var(--muted);display:grid;place-items:center;padding:0}
.dra:disabled{opacity:.3;cursor:default}
.dra svg{width:18px;height:18px}
/* range */
.rng{display:flex;flex-direction:column;gap:10px;border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--bg)}
.rv{display:flex;align-items:baseline;justify-content:center;gap:6px;font-weight:700}
.rv b{font-family:var(--display);font-size:34px;font-weight:800;color:var(--sel);font-variant-numeric:tabular-nums;line-height:1.1}
.rrow{display:flex;align-items:center;gap:8px}
#rg{flex:1;min-width:0;height:36px;margin:0;accent-color:var(--sel)}
.rstep{width:44px;height:44px;background:var(--surface);border:2px solid var(--line);font-size:22px;font-weight:900;color:var(--sel);line-height:1}
.rview{font-size:14px;display:flex;flex-direction:column;gap:6px}
.rview .formula{margin:0}
.rbars{display:flex;flex-direction:column;gap:4px}
.rbar{display:flex;align-items:center;gap:8px;font-size:13px}
.rbar span:first-child{width:44px;flex:none;color:var(--muted)}
.rbar i{display:block;height:14px;border-radius:99px;background:var(--line);min-width:6px}
.rbar.hot i{background:var(--bad)}
.rbar.hot{color:var(--bad);font-weight:900}
.batch{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:13px}
.batch b{width:52px;flex:none;color:var(--muted);font-weight:700}
.batch i{font-style:normal;padding:0 6px;border-radius:6px;background:var(--sel-bg);color:var(--sel);font-weight:700;font-family:var(--mono);font-size:12px}
.batch i.h{background:var(--stamp-bg);color:var(--stamp)}
.warn{color:var(--bad);font-weight:900}
.foot{border-top:1px solid var(--line);padding:10px 16px calc(12px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px;max-height:58%;overflow-y:auto;flex:none}
.foot.ok{background:var(--ok-bg);border-color:transparent}
.foot.bad{background:var(--bad-bg);border-color:transparent}
.fb{display:flex;flex-direction:column;gap:3px}
.fb .t{font-size:19px;font-weight:900}
.foot.ok .fb .t{color:var(--ok)} .foot.bad .fb .t{color:var(--bad)}
.fb .a{font-size:13px;line-height:1.55}
.fb .a .ans{font-weight:900}
.flowbox{overflow-x:auto;background:var(--surface);border-radius:8px;padding:6px}
.flowbox svg{margin:0 auto;max-width:100%;height:auto}
.flowbox text{font-family:var(--body);fill:var(--ink)}
.ansbox{border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13px}
.ansbox p{margin:0 0 8px}
.ansbox p:last-child{margin-bottom:0}
.ansbox .note{color:var(--muted)}
.result{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px 16px;text-align:center;overflow-y:auto}
.result h1{margin:0;font-size:22px;font-weight:900;text-wrap:balance}
.rstamp{width:112px;height:112px;border-radius:50%;background:var(--gold);color:var(--surface);display:grid;place-items:center;font-weight:900;font-size:22px;box-shadow:inset 0 0 0 4px var(--gold),inset 0 0 0 7px var(--surface),0 6px 0 var(--gold-d);transform:rotate(-9deg);animation:press .35s ease-out}
.rstamp.no{background:var(--lock);color:var(--muted);box-shadow:none;transform:none;animation:none}
@keyframes press{0%{transform:rotate(-9deg) scale(1.8);opacity:0}70%{transform:rotate(-9deg) scale(.94);opacity:1}100%{transform:rotate(-9deg) scale(1)}}
.rt{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
.rtile{border:2px solid var(--line);border-radius:14px;padding:8px 4px}
.rtile small{display:block;color:var(--muted);font-size:12px}
.rtile b{display:block;font-family:var(--display);font-weight:800;font-size:22px;font-variant-numeric:tabular-nums}

/* lists */
.search{width:100%;min-height:44px;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:16px}
.wl{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:0 12px}
.wi{padding:9px 0;border-bottom:1px solid var(--line)}
.wi:last-child{border-bottom:0}
.wi b{display:block}
.wi span{font-size:13px;color:var(--muted)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;font-weight:700}
.tg{width:52px;height:32px;border-radius:99px;background:var(--lock);border:0;position:relative;flex:none}
.tg::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:var(--surface);transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.tg.on{background:var(--accent)}
.tg.on::after{left:24px}
.big-num{font-family:var(--mono);font-weight:700;font-size:24px;font-variant-numeric:tabular-nums}
@media (min-width:900px){
  #app,.lwrap,.spanel{max-width:760px}

  .opt{font-size:16px}.mt{font-size:15px}
  .fb .a,.ansbox,.small,table,.nlabel{font-size:14.5px}
  .unit b{font-size:18px}
}
/* feedback motion */
.mascot{flex:none;overflow:visible}
.mascot.ok{animation:hop .55s ease-out}
.mascot.bad{animation:droop .6s ease-out}
.mascot.win{animation:cheer .9s ease-in-out 2}
.mascot.idle{animation:breathe 2.6s ease-in-out infinite}
@keyframes hop{0%{transform:none}35%{transform:translateY(-12px) rotate(-6deg)}65%{transform:none}82%{transform:translateY(-4px)}100%{transform:none}}
@keyframes droop{0%{transform:none}30%{transform:translateX(-4px) rotate(-5deg)}60%{transform:translateX(4px) rotate(5deg)}100%{transform:none}}
@keyframes cheer{0%,100%{transform:none}25%{transform:translateY(-10px) rotate(-5deg)}75%{transform:translateY(-10px) rotate(5deg)}}
@keyframes breathe{50%{transform:translateY(-2px)}}
.fbrow{display:flex;align-items:center;gap:10px}
.foot.ok,.foot.bad{animation:rise .24s ease-out}
@keyframes rise{from{transform:translateY(36px);opacity:.3}to{transform:none;opacity:1}}
.opt.ok,.mt.gone,.tile.pop{animation:pop .32s ease-out}
.opt.bad{animation:shake .35s}
@keyframes pop{45%{transform:scale(1.04)}}
.btn.go-ready{animation:ready .3s ease-out}
@keyframes ready{50%{transform:scale(1.02)}}
.hearts.lost svg{animation:heartloss .7s ease-out}
@keyframes heartloss{25%{transform:scale(1.5)}55%{transform:scale(.7) rotate(-14deg)}100%{transform:none}}
.lhead{position:relative}
.pbar i{position:relative}
.pbar i::after{content:"";position:absolute;left:6px;right:6px;top:3px;height:3px;border-radius:99px;background:rgba(255,255,255,.4)}
.pbar.bump i{animation:glow .6s ease-out}
@keyframes glow{40%{filter:brightness(1.35) saturate(1.2)}}
.xpf{position:absolute;right:20px;top:42px;font-family:var(--display);font-weight:800;font-size:16px;color:var(--gold-d);pointer-events:none;animation:floatup .9s ease-out forwards}
@keyframes floatup{0%{opacity:0;transform:translateY(8px)}20%{opacity:1}100%{opacity:0;transform:translateY(-16px)}}
.cb{display:inline-flex;align-items:center;gap:4px;padding:1px 10px;border-radius:99px;background:var(--stamp-bg);color:var(--stamp);animation:pop .4s ease-out}
.cb svg{width:14px;height:14px}
.cb.big{background:var(--stamp);color:var(--surface);font-family:var(--display);font-size:14px;animation:pop .5s ease-out}
.node{transition:transform .12s}
.node:active{transform:translateY(4px);box-shadow:0 2px 0 var(--line)}
.node.cur::after{content:"";position:absolute;inset:-9px;border-radius:inherit;border:4px solid var(--accent);opacity:0;animation:ring 1.8s ease-out infinite}
@keyframes ring{0%{opacity:.6;transform:scale(.9)}100%{opacity:0;transform:scale(1.25)}}
#lesson.on .lwrap{animation:slidein .18s ease-out}
@keyframes slidein{from{transform:translateX(14px);opacity:.55}to{transform:none;opacity:1}}
.result{position:relative}
.cf{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.rhero{display:flex;align-items:center;gap:6px}
.intro .ihead{display:flex;align-items:center;gap:8px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script>
/* ---------- Past-paper data, generated from the study hub's exam page ---------- */
const EXAMS={"net":{"y2025":{"title":"114 學年（2025）期中考","parts":[{"h":"I. 填充（20%，縮寫不給分）","items":[{"t":"f","q":"____ is the core technique of packet switching that receives the entire packet before it can begin to transmit the first bit of the packet onto the outbound link.","a":["store-and-forward","store and forward"],"s":"Store-and-forward","w":"路由器要收到整包才往外送。"},{"t":"f","q":"An ____ is a meeting point where multiple ISPs can peer together and it is typically in a stand-alone building with its own switches.","a":["internet exchange point"],"s":"Internet Exchange Point","w":"寫 IXP 不給分。"},{"t":"f","q":"A ____ is the network of thousands of similarly compromised devices which the bad guys control against targeted hosts.","a":["botnet"],"s":"botnet","w":"被控制的受害電腦大軍。"},{"t":"f","q":"A ____ defines the format and the order of messages exchanged between network entities, as well as the actions taken on message transmission, receipt.","a":["protocol"],"s":"protocol","w":"格式、順序、動作三件事。"},{"t":"f","q":"The documents describing Internet standard specifications approved by IETF and designated by numbers are called ____.","a":["request for comments","requests for comments"],"s":"Request for Comments","w":"寫 RFC 不給分。"},{"t":"f","q":"A ____ link is the network link that determines the end-to-end throughput between Host A and Host B.","a":["bottleneck"],"s":"bottleneck","w":"路徑上最慢的那段決定整條的 throughput。"},{"t":"f","q":"The phenomenon where many autonomous peers join or leave simultaneously is called ____.","a":["churn","peer churn"],"s":"churn","w":"P2P 裡 peer 來來去去。"},{"t":"f","q":"The server placement philosophy called ____ for content distribution networks is to build large clusters at a smaller number (for example, tens) of sites, typically placed in IXPs.","a":["bring home"],"s":"bring home","w":"少量大倉庫。另一種是 enter deep，深入 access ISP。"},{"t":"f","q":"With DASH, each video version is stored in the HTTP server, each with a different URL. The HTTP server also has a ____, which provides a URL for each version along with its bit rate.","a":["manifest file","manifest"],"s":"manifest file","w":"播放端靠這份清單選畫質。"},{"t":"f","q":"A performance-limiting phenomenon that occurs when a line of packets is held up by the first packet is called ____.","a":["head-of-line blocking","head of line blocking","hol blocking"],"s":"head-of-line blocking","w":"前面的大物件擋住後面的小物件。這份考卷要寫全名。"}]},{"h":"II. 單選（40%）","items":[{"t":"c","q":"Which media is most likely for non-shared access?","o":["twisted-pair copper wire","power-line wire","coaxial cable","radio channels"],"a":0,"w":"DSL 的雙絞線是每戶專線；cable、電力線、無線都共用。"},{"t":"c","q":"Which computing devices are not hosts in the Internet jargon?","o":["smart phones","personal computers","cloud servers","edge routers"],"a":3,"w":"router 在核心做轉送，不是跑應用程式的 host。"},{"t":"c","q":"Which is the transmission rate (bits/time unit, instantaneous or average) of the links over the data flows transferred between sender and receiver?","o":["latency","bandwidth","throughput","delay"],"a":2,"w":"端到端實際傳輸速率是 throughput。bandwidth 是單條線路的上限。"},{"t":"c","q":"Which delay is the time waiting at the output link for transmission and depends on the congestion level of router?","o":["nodal processing","queueing","transmission","propagation"],"a":1,"w":"排隊看塞車程度。"},{"t":"c","q":"Increasing the number of router's buffers will reduce","o":["packet queueing delay","packet transmission delay","packet propagation delay","packet loss rate"],"a":3,"w":"空間變大，比較不會被丟；排隊延遲反而可能變長。"},{"t":"c","q":"Which program can NOT be used to test the connectivity of the remote host?","o":["telnet","nslookup","ping","traceroute"],"a":1,"w":"nslookup 只問 DNS 伺服器，沒有碰到目標主機。"},{"t":"c","q":"Which network attacks can modify or delete messages?","o":["DoS attacks","worm attacks","IP spoofing attacks","man-in-the-middle attacks"],"a":3,"w":"夾在中間才能改或刪。"},{"t":"c","q":"Which HTTP method uploads input in the URL field of a request line?","o":["GET","PUT","POST","HEAD"],"a":0,"w":"GET 把資料接在網址後，例如 ?monkeys&banana。POST 放在 body。"},{"t":"c","q":"Which of the following header line is included in HTTP response message to send state information?","o":["Get-Cookie","Set-Cookie","Cookie","Put-Cookie"],"a":1,"w":"回應用 Set-Cookie，請求用 Cookie。"},{"t":"c","q":"Which header field responded by a Web server is referenced by a browser specifically for conditional GET?","o":["Last-Modified","If-Modified-Since","Time","Date"],"a":0,"w":"題目問「伺服器回的」，所以是 Last-Modified。瀏覽器送的才是 If-Modified-Since。"},{"t":"c","q":"Comparing to HTTP 1.0, which method is new to HTTP 1.1?","o":["POST","HEAD","GET","PUT"],"a":3,"w":"HTTP/1.1 新增 PUT 和 DELETE。"},{"t":"c","q":"Which HTTP response status code means the requested object is moved and the new location is specified later in this message?","o":["200","301","404","505"],"a":1,"w":"301 Moved Permanently。"},{"t":"c","q":"Which field is NOT included in a DNS resource record?","o":["name","value","TTL","date"],"a":3,"w":"格式是 (name, value, type, TTL)。"},{"t":"c","q":"For an organization to register a new domain name, they need to set up a","o":["local name server","root name server","top-level name server","authoritative name server"],"a":3,"w":"註冊時要提供權威伺服器的名字和 IP。"},{"t":"c","q":"What DNS record provides the standard hostname-to-IP address mapping?","o":["Type A","Type NS","Type CNAME","Type MX"],"a":0,"w":"原卷第二個選項誤印成 (A)。A 紀錄就是主機名對 IP。"},{"t":"c","q":"In a complete circular DHT of 2¹² peers with identities from 0 to 4095, each node has shortcuts to its next 2ᵏ-distance neighbors (0≤k≤11) and will forward a message to its maximum-distance neighbor as possible. To send a query from Peer 1357 to Peer 3638, which is NOT the distance traveled along the path?","o":["64","32","16","8"],"a":2,"w":"距離 2281 = 2048 + 128 + 64 + 32 + 8 + 1，沒有 16。"},{"t":"c","flag":1,"q":"For file distribution, the P2P model is expected to perform better than the client-server model by total","o":["increased server download bandwidth","decreased server upload bandwidth","increased peer download bandwidth","decreased peer upload bandwidth"],"a":1,"w":"這題選項改得很彆扭。P2P 的關鍵是 peer 分擔上傳，所以伺服器要上傳的量減少。2024 同題的答案是 peer upload bandwidth，今年沒有「增加 peer 上傳」這個選項，四個裡 (B) 最合理。"},{"t":"c","q":"Which suffers the identity spoofing problem?","o":["HTTP","FTP","SMTP","POP3"],"a":2,"w":"SMTP 不驗證寄件人，可以冒名寄信。"},{"t":"c","flag":1,"q":"To exchange a file or message, which has the most round-trip time?","o":["HTTP","FTP","SMTP","POP3"],"a":2,"w":"HELO、MAIL FROM、RCPT TO、DATA、內文、QUIT，每步都一來一回。FTP 流程也長，有爭議空間。"},{"t":"c","q":"Which is stateless?","o":["HTTP","FTP","SMTP","POP3"],"a":0,"w":"伺服器不記之前的請求。FTP 會記目前目錄和登入狀態。"}]},{"h":"III. 問答（40%）","items":[{"t":"e","q":"(16%) A Web page consisting of a base HTML file and five embedded JPEG images resides on a server. One round-trip delay is required to setup a TCP connection, and non-pipelined HTTP is used. Depict the flow diagrams and show the total RTTs:<br>(a) non-persistent, non-parallel<br>(b) persistent, non-parallel<br>(c) non-persistent with one additional parallel connection (two in total)<br>(d) persistent, non-parallel, and three of the five images reside on another server, which can be connected concurrently","a":"<code class=\"expr\">(a) 6 個檔案 × 2 = 12 RTT\n(b) 開連線 1 + 6 個檔案 = 7 RTT\n(c) HTML 2 + 5 張圖分 3 批 × 2 = 2 + 6 = 8 RTT\n(d) 第一台：開連線 1 + HTML 1 + 2 張圖 = 4\n    第二台從第 2 趟後開始：2 + 開連線 1 + 3 張圖 = 6\n    同時進行，取較慢的 = 6 RTT\n\n老師投影片的寫法：\n(a) (1 + 5 JPEG) × 2 = 12\n(b) 2 + 5 JPEG = 7\n(c) (1 + ⌈5/2⌉ JPEG) × 2 = 8\n(d) 2 + 1 + 3 JPEG = 6</code><p><b>這題老師上課公布過解答並說必考。</b>流程圖在總整理的 RTT 實驗台按 <b>2025 (a)–(d)</b> 就會畫出來。</p>"},{"t":"e","q":"(4%/8%) Security and privacy issues of HTTP.<br>(a) Comparing with HTTPS, why is HTTP insecure?<br>(b) Explain and demonstrate the security and privacy problems with HTTP's cookies.","a":"<p><b>(a)</b> HTTP 以明文傳輸，沒有加密（會被竊聽）、沒有完整性檢查（會被竄改）、也沒有驗證伺服器身分（會遇到冒牌網站）。HTTPS 是 HTTP 跑在 TLS 上，提供 encryption、data integrity、end-point authentication。</p>\n  <p><b>(b) 隱私：</b>第三方 cookie 能跨網站追蹤。</p><code class=\"expr\">1. 逛 nytimes.com，頁面嵌了 AdX 廣告\n2. AdX 回 Set-Cookie: 7493，並記下 Referrer: nytimes\n3. 逛 socks.com，同樣有 AdX 廣告\n4. 瀏覽器送 Cookie: 7493，Referrer: socks.com\n5. AdX 把兩筆紀錄串起來，回到 nytimes 時顯示襪子廣告</code>\n  <p><b>安全：</b>在 HTTP 上 cookie 是明文。攻擊者監聽到登入後的 cookie，就能冒用這個身分（session hijacking）。</p>"},{"t":"e","q":"(6%/3%/3%) BitTorrent.<br>(a) Explain its incentive mechanism for trading algorithm.<br>(b) Bob does not want to upload any data to other peers (free-riding). He claims he can still receive a complete copy of the file. Is it possible?<br>(c) He further claims he can make free-riding more efficient by using multiple computers with distinct IP addresses. Is it possible?","a":"<p><b>(a) tit-for-tat：</b>每個 peer 只上傳給目前傳給它最快的 4 位，每 10 秒重新評估，其他人被 choke。另外每 30 秒隨機 optimistically unchoke 一位，讓新 peer 有機會，也可能找到更好的夥伴。結果是上傳越快，下載也越快。</p>\n  <p><b>(b) 可能。</b>Bob 會被別人的 optimistic unchoke 選中而拿到碎片，只要 swarm 裡有足夠的 peer 待得夠久，最後能拿齊，只是很慢。</p>\n  <p><b>(c) 可能。</b>不同 IP 會被視為不同 peer，被 optimistic unchoke 的機會變多。每台 free-ride，再用小程式協調各台要不同的碎片，最後合併成完整檔案。</p>"}]}]},"y2024":{"title":"113 學年（2024）期中考","parts":[{"h":"I. 填充（20%）","items":[{"t":"f","q":"____ is the core technique of packet switching that receives the entire packet before it can begin to transmit the first bit of the packet onto the outbound link.","a":["store-and-forward","store and forward"],"s":"Store-and-forward","w":"收到整包才送。"},{"t":"f","q":"The access network physically connects an end system to the first router (also known as the ____) on a path from the end system to any other distant end system.","a":["edge router"],"s":"edge router","w":"網路邊緣的第一台路由器。"},{"t":"f","q":"An ____ is a meeting point where multiple ISPs can peer together and it is typically in a stand-alone building with its own switches.","a":["internet exchange point","ixp"],"s":"Internet Exchange Point（IXP）","w":"2024 沒寫縮寫不給分，但全名最保險。"},{"t":"f","q":"A ____ defines the format and the order of messages exchanged between network entities, as well as the actions taken on message transmission, receipt.","a":["protocol"],"s":"protocol","w":"格式、順序、動作。"},{"t":"f","q":"____ delay is the time waiting at the output link for transmission and depends on the congestion level of router.","a":["queueing","queuing"],"s":"Queueing","w":"在出口排隊。"},{"t":"f","q":"The incentive mechanism for trading algorithm in BitTorrent is called ____.","a":["tit-for-tat","tit for tat"],"s":"tit-for-tat","w":"你傳給我，我才傳給你。"},{"t":"f","q":"A performance-limiting phenomenon that occurs when a line of packets is held up by the first packet is called ____.","a":["head-of-line blocking","head of line blocking","hol blocking","hol"],"s":"head-of-line (HOL) blocking","w":"前面擋住後面。"},{"t":"f","q":"A ____ is a geographically distributed network of proxy servers where client's requests are distributed to nearby or load-shared servers to provide high availability and high performance for multiple providers.","a":["content distribution network","content delivery network","cdn"],"s":"content distribution network（CDN）","w":"把內容放到各地倉庫。"},{"t":"f","q":"A ____ is the network of thousands of similarly compromised devices which the bad guys control against targeted hosts.","a":["botnet"],"s":"botnet","w":"被控制的受害電腦大軍。"},{"t":"f","q":"The phenomenon where many autonomous peers join or leave simultaneously is called ____.","a":["churn","peer churn"],"s":"churn","w":"peer 來來去去。"}]},{"h":"II. 單選（40%）","items":[{"t":"c","q":"Which is unguided media?","o":["radio channel","coaxial cable","HFC","twisted-pair copper wire"],"a":0,"w":"無線電在空氣中傳；其他都有實體線路。"},{"t":"c","q":"Which is the transmission rate (bits/time unit, instantaneous or average) of the links over the data flows transferred between sender and receiver?","o":["latency","bandwidth","throughput","delay"],"a":2,"w":"端到端實際速率。"},{"t":"c","q":"Which computing devices are not hosts in the Internet jargon?","o":["smart phone","PC","server","router"],"a":3,"w":"router 只轉送。"},{"t":"c","q":"Increasing the number of router's buffers will reduce","o":["packet queueing delay","packet transmission delay","packet propagation delay","packet loss rate"],"a":3,"w":"比較不會被丟。"},{"t":"c","q":"Which of the following header line is included in HTTP response message to send state information?","o":["Get-Cookie","Set-Cookie","Cookie","Put-Cookie"],"a":1,"w":"回應用 Set-Cookie。"},{"t":"c","q":"For file distribution, the P2P model is expected to perform better than the client-server model by utilizing","o":["server download bandwidth","server upload bandwidth","peer download bandwidth","peer upload bandwidth"],"a":3,"w":"多出來的資源是每個 peer 的上傳能力。"},{"t":"c","q":"In a complete circular DHT of 2¹² peers with identities from 0 to 4095, each node has shortcuts to its next 2ᵏ-distance neighbors (0≤k≤11) and forwards a message to its maximum-distance neighbor as possible. To send a query from Peer 47 to Peer 1288, which is NOT the distance traveled along the path?","o":["64","32","16","8"],"a":1,"w":"距離 1241 = 1024 + 128 + 64 + 16 + 8 + 1，沒有 32。"},{"t":"c","q":"Which program can NOT be used to test the condition of the remote host?","o":["telnet","ipconfig","ping","traceroute"],"a":1,"w":"ipconfig 只看本機的網路設定。"},{"t":"c","q":"Which is NOT true for DNS?","o":["application-layer","strictly belong to hierarchy","hierarchical database","support host aliasing"],"a":1,"w":"投影片寫 local DNS server doesn't strictly belong to hierarchy。"},{"t":"c","q":"Which must be supported by any device that directly connects to the Internet?","o":["TCP","IP","HTTP","DNS"],"a":1,"w":"IP 是所有網路設備的共通語言，router 也要；TCP、HTTP 不一定。"},{"t":"c","flag":1,"q":"To exchange a file or message, which has the most round-trip time?","o":["HTTP","FTP","SMTP","POP3"],"a":2,"w":"SMTP 的指令來回最多。FTP 也不短，有爭議空間。"},{"t":"c","q":"Which HTTP response status code means the requested object is moved and the new location is specified later in this message?","o":["200","301","404","505"],"a":1,"w":"301 Moved Permanently。"},{"t":"c","q":"Which network attacks can modify or delete messages?","o":["DoS attacks","worm attacks","IP spoofing attacks","man-in-the-middle attacks"],"a":3,"w":"夾在中間才能改或刪。"},{"t":"c","q":"Comparing to HTTP 1.0, which method is new to HTTP 1.1?","o":["POST","HEAD","GET","PUT"],"a":3,"w":"PUT 是 1.1 才有。"},{"t":"c","q":"Which is stateless?","o":["HTTP","FTP","SMTP","POP3"],"a":0,"w":"HTTP 不記狀態。"},{"t":"c","flag":1,"q":"Which can reuse the connection for different users of the same ends of hosts?","o":["HTTP","FTP","SMTP","POP3"],"a":2,"w":"兩台郵件伺服器之間的 SMTP 連線，可連續送多位使用者的信。FTP、POP3 都綁登入者。"},{"t":"c","q":"Which requires the maximum number of TCP connections to transmit multiple files or mails?","o":["HTTP","FTP","SMTP","POP3"],"a":1,"w":"1 條控制連線，每個檔案再開 1 條資料連線。"},{"t":"c","q":"Which is primarily a content push model?","o":["HTTP","FTP","SMTP","POP3"],"a":2,"w":"寄件方把信推出去；HTTP、POP3 是 pull。"},{"t":"c","q":"What type of DNS record provides querying mail server names for a domain name?","o":["A","MX","CNAME","NS"],"a":1,"w":"MX = mail exchange。"},{"t":"c","q":"Which field is NOT included in a DNS resource record?","o":["name","value","TTL","date"],"a":3,"w":"格式是 (name, value, type, TTL)。"}]},{"h":"III. 問答（40%）","items":[{"t":"e","q":"(15%) A Web page consisting of a base HTML file and six embedded JPEG images resides on a server. One round-trip delay is required to setup a TCP connection, and non-pipelined HTTP is used. Depict the flow diagrams and show the total RTTs:<br>(a) non-persistent, non-parallel<br>(b) persistent, non-parallel<br>(c) persistent with two additional parallel connections (two connections in total)","a":"<code class=\"expr\">(a) 7 個檔案 × 2 = 14 RTT\n(b) 開連線 1 + 7 個檔案 = 8 RTT\n(c) 題目矛盾，先寫明假設：\n    總共 2 條：第 2 趟拿到 HTML。\n      第 3 趟：舊線拿 1 張，新線握手。\n      剩 5 張分給 2 條要 3 趟。2 + 1 + 3 = 6 RTT\n    總共 3 條：第 3 趟舊線拿 1 張，兩條新線握手。\n      剩 5 張分給 3 條要 2 趟。2 + 1 + 2 = 5 RTT</code><p>(c) 的算法假設第二條連線要看到 HTML 才開。實驗台有兩個版本可對照。</p>"},{"t":"e","q":"(12%) Web caches (proxy servers).<br>(a) Explain how the proxy works.<br>(b) Explain remote proxy with a system diagram and its common use case.<br>(c) Explain reverse proxy with a system diagram and its common use case.","a":"<p><b>(a)</b> 瀏覽器把請求送給 proxy。有快取且可用就直接回（hit）；沒有就由 proxy 向原始伺服器要，存一份再回給 client（miss）。它同時是 client 也是 server。</p>\n  <p><b>(b) remote（forward）proxy：</b>站在使用者這邊，代表 client 往外連。用途：校園或公司共用快取、省對外頻寬、過濾內容。</p><code class=\"expr\">使用者們 → [proxy] → Internet → 各網站</code>\n  <p><b>(c) reverse proxy：</b>站在伺服器這邊，代表 server 接請求，client 不知道後面有幾台。用途：負載平衡、快取、隱藏後端、CDN。</p><code class=\"expr\">使用者們 → Internet → [reverse proxy] → 後端伺服器群</code>\n  <p class=\"note\">投影片沒定義 remote proxy，這裡依常見用法解讀。</p>"},{"t":"e","q":"(13%) Users share a 100 Mbps link. Each user transmits continuously at 50 Mbps when transmitting, but only 20 percent of the time.<br>(a) With circuit switching, how many users can be supported?<br>(b) With packet switching, why is there essentially no queuing delay if two or fewer users transmit at the same time?<br>(c) With three users, find the probability that all three transmit simultaneously, the fraction of time the queue grows, and the fraction of time the queue shrinks.","a":"<code class=\"expr\">(a) 100 ÷ 50 = 2 人\n(b) 兩人最多 2 × 50 = 100 Mbps，不超過線路速率，封包進來就能送走\n(c) 三人同時傳 = 0.2³ = 0.008\n    佇列變長：輸入 150 > 100，只有三人同時傳，比例 0.008\n    佇列變短：輸入 &lt; 100，最多 1 人在傳\n      P(0 人) = 0.8³ = 0.512\n      P(1 人) = 3 × 0.2 × 0.8² = 0.384\n      合計 0.896\n    剛好 2 人：3 × 0.2² × 0.8 = 0.096，輸入等於輸出，佇列不變</code><p class=\"note\">四個機率加起來 0.512 + 0.384 + 0.096 + 0.008 = 1，可用來驗算。佇列要有東西才會真的變短，所以 0.896 是上限；考題作答時說明一下條件即可。</p>"}]}]},"older":{"title":"2021–2023 期中考：2024、2025 沒考過的題目","parts":[{"h":"填充","items":[{"t":"f","y":"2021","q":"When a packet arrives at a router, the router examines the address and searches its ____, using this destination address, to find the appropriate outbound link.","a":["forwarding table"],"s":"forwarding table","w":"查表決定走哪個出口。"},{"t":"f","y":"2021","q":"The ____ network is a network that physically connects an end system to the first router on a path to any other distant end system.","a":["access"],"s":"access","w":"你家到第一台路由器那段。"},{"t":"f","y":"2021、2023","q":"In ____ networks, the resources needed along a path (buffers, link transmission rate) are reserved for the duration of the communication session.","a":["circuit-switched","circuit switched","circuit switching","circuit-switching"],"s":"circuit-switched","w":"先預留資源。"},{"t":"f","y":"2023","q":"With ____, time is divided into frames of fixed duration, and each frame is divided into a fixed number of time slots.","a":["time-division multiplexing","time division multiplexing","tdm"],"s":"time-division multiplexing（TDM）","w":"切時間給每條連線。"},{"t":"f","y":"2021–23","q":"____ is the concept that at the sending host, the content of a layer is appended with additional information, usually in the header, and then passed to the lower layer.","a":["encapsulation"],"s":"encapsulation","w":"每層多包一層 header。"},{"t":"f","y":"2022、2023","q":"A process sends messages into, and receives messages from, the network through a software interface called a ____.","a":["socket"],"s":"socket","w":"程式和網路之間的門。"},{"t":"f","y":"2022、2023","q":"The base station of wireless LANs such as 802.11 (WiFi) is also known as ____.","a":["access point","ap"],"s":"access point","w":"Wi-Fi 基地台。"},{"t":"f","y":"2022","q":"The server placement philosophy called ____ for content distribution networks is deploying server clusters in access ISPs all over the world.","a":["enter deep"],"s":"enter deep","w":"深入各地 access ISP，對照 bring home。"},{"t":"f","y":"2022","q":"The category of Internet DoS attacks called ____ involves sending a few well-crafted messages to a vulnerable application or operating system running on a targeted host.","a":["vulnerability attack","vulnerability attacks"],"s":"vulnerability attack","w":"少量但精準的訊息。"},{"t":"f","y":"2021","q":"A ____ is a commercial entity that verifies the uniqueness of the domain name, enters the domain name into the DNS database, and collects a small fee for its services.","a":["registrar"],"s":"registrar","w":"網域註冊商。2022、2023 也考過單選版。"}]},{"h":"單選","items":[{"t":"c","y":"2021、2022","q":"Which delay is variable?","o":["processing","propagation","queuing","transmission"],"a":2,"w":"看當下塞車程度。"},{"t":"c","y":"2021","q":"Which delay is reduced by shortening the distance between two routers?","o":["processing","propagation","queuing","transmission"],"a":1,"w":"d/s，距離變短就變小。"},{"t":"c","y":"2021、2023","q":"The link-layer data are often called as","o":["datagrams","frames","messages","segments"],"a":1,"w":"link 層叫 frame。"},{"t":"c","y":"2022","q":"The transport-layer data are often called as","o":["datagrams","frames","messages","segments"],"a":3,"w":"transport 層叫 segment。"},{"t":"c","y":"2023","q":"Which belongs to the network layer?","o":["IP","UDP","HTTP","802.11"],"a":0,"w":"UDP 在 transport，HTTP 在 application，802.11 在 link。"},{"t":"c","y":"2022","q":"Transport Layer Security (TLS) belongs to the","o":["application layer","transport layer","network layer","none of above"],"a":0,"w":"名字有 transport，但投影片寫 TLS implemented in application layer。"},{"t":"c","y":"2021","q":"Which is most likely NOT happened in the network layer?","o":["packet collision","packet delay","packet loss","packet sniffing"],"a":0,"w":"collision 發生在 link 層的共用媒介。"},{"t":"c","y":"2022、2023","q":"A passive receiver that records a copy of every packet that flies by is called a","o":["packet loss","packet sniffer","packet delay","packet spoofing"],"a":1,"w":"被動監聽。"},{"t":"c","y":"2022","q":"Which is NOT supported by TCP?","o":["reliable segment-based transfer","4-tuple connection-oriented management","end-to-end congestion control","end-to-end flow control"],"a":0,"w":"TCP 是 byte stream，不是 segment-based。"},{"t":"c","y":"2021","q":"Which header line is included in HTTP request message to send state information?","o":["Get-Cookie","Set-Cookie","Cookie","Put-Cookie"],"a":2,"w":"這次問 request，所以是 Cookie。方向跟 2024、2025 相反。"},{"t":"c","y":"2022","q":"Which header field has the value that is sent by the browser to the server for conditional GET?","o":["If-Modified-Since","Last-Modified","Date","Time"],"a":0,"w":"這次問瀏覽器送的。"},{"t":"c","y":"2021–23","q":"Which has different style of response or status codes from the others?","o":["HTTP","FTP","SMTP","POP3"],"a":3,"w":"POP3 回 +OK／-ERR，其他回三位數字。"},{"t":"c","y":"2021、2022","q":"To exchange a file or message, which has the least round-trip time?","o":["HTTP","FTP","SMTP","POP3"],"a":0,"w":"開連線＋一次請求。"},{"t":"c","y":"2022、2023","q":"For an organization to resolve domain names, it usually needs to setup a","o":["local name server","root name server","top-level name server","authoritative name server"],"a":0,"w":"「解析」用 local；「擁有網域」才是 authoritative。"},{"t":"c","y":"2021","q":"What DNS record provides querying hosts the canonical name for a hostname?","o":["Type A","Type NS","Type CNAME","Type MX"],"a":2,"w":"CNAME = canonical name。"},{"t":"c","y":"2021","q":"In a circular DHT of 2¹² peers with 2ᵏ shortcuts, to send a query from Peer 114 to Peer 1357, which is NOT the distance traveled along the path?","o":["64","32","16","8"],"a":1,"w":"距離 1243 = 1024 + 128 + 64 + 16 + 8 + 2 + 1，沒有 32。"}]},{"h":"問答","items":[{"t":"e","y":"2023","q":"What is the HOL blocking problem with HTTP/1.1? Explain the HTTP/2 solution.","a":"<p>HTTP/1.1 在一條 TCP 上照請求順序回應（FCFS）。若第一個是大物件，後面的小物件都要等它傳完，這就是 HOL blocking。</p><p>HTTP/2 把物件切成 frame 交錯傳送，並可依 client 指定的優先權排序，小物件就能很快送達，大物件只慢一點點。</p>"},{"t":"e","y":"2023","q":"Sending a packet from source to destination over a fixed route. (a) List and explain the delay components. (b) Discuss how to improve each component.","a":"<div class=\"tw\"><table><tr><th>延遲</th><th>解釋</th><th>改善</th></tr><tr><td>processing</td><td>檢查 header、決定出口</td><td>更快的路由器</td></tr><tr><td>queueing</td><td>在出口排隊，看壅塞程度</td><td>減少流量、加大出口頻寬</td></tr><tr><td>transmission</td><td>L/R，把封包推上線路</td><td>提高線路速率、縮小封包</td></tr><tr><td>propagation</td><td>d/s，訊號在線路上跑</td><td>縮短距離（如 CDN 靠近使用者）</td></tr></table></div>"},{"t":"e","y":"2023","q":"Cookies in HTTP. (a) Draw the message flow with specific header fields. (b) Explain potential privacy and security problems.","a":"<code class=\"expr\">client → server: 一般 HTTP 請求\nserver → client: 回應 + Set-Cookie: 1678（後端資料庫建檔）\nclient → server: 請求 + Cookie: 1678（伺服器查資料庫，做對應動作）\n一週後 client → server: 請求 + Cookie: 1678</code><p>(b) 隱私：第三方 cookie 能跨站追蹤。安全：HTTP 明文傳 cookie，可能被竊聽後冒用身分。</p>"},{"t":"e","y":"2021","q":"Real-time voice (VoIP): 64 kbps bit stream, 64-byte packets, one link of 1 Mbps with 10 msec propagation delay. How much time elapses from when a bit is created until it is decoded at Host B?","a":"<code class=\"expr\">湊滿一包 = 64 × 8 bits ÷ 64 kbps = 8 ms\ntransmission = 512 bits ÷ 1 Mbps = 0.512 ms\npropagation = 10 ms\n總共 = 8 + 0.512 + 10 = 18.512 ms</code><p>第一步最容易漏：bit 要等封包湊滿才會送出。這個時間叫 packetization delay。</p>"},{"t":"e","y":"2021","q":"HTML + 5 images; two images on the same server, three on another. Answer non-persistent and persistent (non-parallel).","a":"<p>依序抓時，連第二台要多開連線：</p><code class=\"expr\">non-persistent：每個檔案都 2 趟，6 × 2 = 12 RTT\npersistent：第一台 1 + HTML 1 + 2 張 = 4\n            第二台 1 + 3 張 = 4\n            依序 4 + 4 = 8 RTT；兩台同時連則 max(4, 2 + 4) = 6 RTT</code><p class=\"note\">題目沒說能不能同時連，作答時寫明假設。</p>"},{"t":"e","y":"2022","q":"HTML on server P and n images on s servers. (a) n=4, s=1: total RTTs. (b) Compare parallel with persistent. (c) Compare parallel with pipelining.","a":"<code class=\"expr\">(a) 基本 HTTP：5 個檔案 × 2 = 10 RTT\n(b) n=4，1 台：\n    parallel（non-persistent，4 條同時）：2 + 2 = 4 RTT\n    persistent（1 條）：1 + 5 = 6 RTT\n(c) pipelining（persistent，1 條）：1 + 1 + 1 = 3 RTT\n    parallel 2 條：2 + ⌈4÷2⌉ × 2 = 6 RTT</code><p>結論：parallel 靠多條連線同時抓，條數夠多才快，但佔用較多資源；pipelining 只用一條，圖越多越划算。</p>"},{"t":"e","y":"2022","q":"BitTorrent. (a) How does a peer join and start exchanging? (b) Explain tit-for-tat and how to choose the missing chunks.","a":"<p><b>(a)</b> 向 tracker 註冊，拿到 peer 名單，連上一部分當鄰居，開始交換碎片。</p><p><b>(b)</b> 只上傳給傳給自己最快的 4 位，每 10 秒重選，每 30 秒 optimistic unchoke 一位。要碎片時採 <b>rarest first</b>，先要最少人有的。</p>"},{"t":"e","y":"2022","q":"Circular DHT of 2¹² peers, Peer 111 queries Peer 1345. Relay peers and message count for (a) simple circular DHT and (b) with 2ᵏ shortcuts.","a":"<code class=\"expr\">距離 = 1234 = 1024 + 128 + 64 + 16 + 2\n(a) 普通環：沿著 112, 113, ... 1344 轉送，1234 則訊息\n(b) 有捷徑：111 → 1135 → 1263 → 1327 → 1343 → 1345\n    中繼 1135, 1263, 1327, 1343，5 則訊息</code><p class=\"note\">這裡只算查詢訊息，不含回覆。</p>"}]}]}}};

/* ---------- Helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=a=>a[Math.random()*a.length|0];
const norm=s=>String(s).toLowerCase().replace(/[’‘`]/g,"'").replace(/[\s\-_]+/g,"").replace(/\.$/,"");
function lev(a,b){const d=[];for(let i=0;i<=a.length;i++)d[i]=[i];for(let j=0;j<=b.length;j++)d[0][j]=j;
  for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[a.length][b.length]}

/* Step builders. Every step: k = card | choice | fill | order | match | flash | sort | drag | range | guide */
const K=(title,html)=>({k:"card",title,html});
const C=(q,o,a,why,x)=>({k:"choice",q,o,a,why,...x});
const F=(q,ans,show,why,x)=>({k:"fill",q,ans,show,why,...x});
const O=(q,seq,why,x)=>({k:"order",q,seq,why,...x});
const M=(q,pairs)=>({k:"match",q,pairs});
const Fl=(q,a,x)=>({k:"flash",q,a,...x});
const G=fn=>({gen:fn});
/* B: tap a card, then tap a bucket. items = [[text, bucket index], ...] */
const B=(q,cats,items,why,x)=>({k:"sort",q,cats,items,why,...x});
/* D: drag rows (or use the arrows) into the right order. seq = correct order; shown shuffled */
const D=(q,seq,why,x)=>({k:"drag",q,seq,why,...x});
/* Sl: slider. cfg = {min,max,step,init,unit,label,view:v=>html (live), ok:v=>bool, show:"answer text"}; init must be wrong */
const Sl=(q,cfg,why,x)=>({k:"range",q,...cfg,why,...x});
/* Gd: guided lesson inside one step. goal = what you'll understand; steps = [{q, o, a, miss:[why each option is wrong, "" for the answer], why, note}];
   wrap = the rule you just derived. Wrong picks explain themselves and you pick again; no hearts lost. */
const Gd=(goal,steps,wrap)=>({k:"guide",q:goal,goal,steps,wrap});

/* Flow diagram used in feedback: one client/server pair per connection, each round trip a V */
function flow(cols){
  const left=22,cw=150,sh=34,top=24,total=Math.max(...cols.map(c=>(c.start||0)+c.seq.length));
  const W=Math.max(left+cols.length*cw,240),H=top+total*sh+4;
  let s=`<svg viewBox="0 0 ${W} ${H}" width="${W}" role="img" aria-label="流程圖，總共 ${total} RTT">`;
  for(let t=0;t<total;t++)s+=`<text x="2" y="${top+t*sh+sh/2+4}" font-size="12" font-weight="700">${t+1}</text>`;
  cols.forEach((c,i)=>{const x=left+i*cw,cx=x+10,sx=x+cw-16,st=c.start||0,y0=top+st*sh,y1=y0+c.seq.length*sh;
    s+=`<text x="${cx}" y="13" font-size="12" text-anchor="middle">C</text><text x="${sx}" y="13" font-size="12" text-anchor="middle">${c.s}</text>`;
    s+=`<line x1="${cx}" y1="${y0}" x2="${cx}" y2="${y1}" stroke="currentColor"/><line x1="${sx}" y1="${y0}" x2="${sx}" y2="${y1}" stroke="currentColor"/>`;
    c.seq.forEach((lb,t)=>{const y=y0+t*sh,col=lb==="TCP"?"var(--muted)":lb==="HTML"?"var(--accent)":"var(--ok)";
      s+=`<line x1="${cx}" y1="${y+3}" x2="${sx-2}" y2="${y+sh/2-2}" stroke="${col}" stroke-width="1.6" marker-end="url(#ah)"/><line x1="${sx}" y1="${y+sh/2}" x2="${cx+2}" y2="${y+sh-3}" stroke="${col}" stroke-width="1.6" marker-end="url(#ah)"/><text x="${sx-5}" y="${y+sh-3}" font-size="12" text-anchor="end">${lb}</text>`})});
  return `<div class="flowbox">${s}</svg></div>`;
}

/* ---------- RTT question generators (same arithmetic as the hub's simulator) ---------- */
const NS=[3,4,6,7,8];
const rtt={
  np:n=>(1+n)*2,
  p:n=>2+n,
  np2:n=>(1+Math.ceil(n/2))*2,

};
const gNp=()=>{const n=pick(NS);return F(`HTML＋<b>${n}</b> 張圖<br>non-persistent，1 條連線。總共幾 RTT？`,[String(rtt.np(n))],rtt.np(n)+" RTT",`<code>(1 + ${n} JPEG) × 2 = ${rtt.np(n)}</code>`,{num:true})};
const gP=()=>{const n=pick(NS);return F(`HTML＋<b>${n}</b> 張圖<br>persistent，1 條連線。總共幾 RTT？`,[String(rtt.p(n))],rtt.p(n)+" RTT",`<code>2 + ${n} JPEG = ${rtt.p(n)}</code>`,{num:true})};
const gNp2=()=>{const n=pick(NS);return F(`HTML＋<b>${n}</b> 張圖<br>non-persistent，總共 <b>2 條</b>同時。總共幾 RTT？`,[String(rtt.np2(n))],rtt.np2(n)+" RTT",`<code>(1 + ⌈${n}/2⌉ JPEG) × 2 = (1 + ${Math.ceil(n/2)}) × 2 = ${rtt.np2(n)}</code>`,{num:true})};
const gP2=()=>{const n=pick(NS);return F(`HTML＋<b>${n}</b> 張圖<br>persistent，總共 <b>2 條</b>。第二條看完 HTML 才開。總共幾 RTT？`,[String(rtt.p2(n))],rtt.p2(n)+" RTT",`<code>2 + 1 + ⌈${n-1}/2⌉ = ${rtt.p2(n)}</code><br>第 3 趟舊線拿 1 張、新線握手，其餘 ${n-1} 張兩條分。`,{num:true})};
const gTwo=()=>{const n=pick([4,5,6,7]),m=pick([1,2,3].filter(x=>x<n));const a=2+(n-m),b=3+m,t=rtt.two(n,m);

const gTx=()=>{const L=pick([500,1000,1250,1500]),R=pick([1,10]),ms=+(L*8/(R*1000)).toFixed(3);return F(`封包 <b>${L} bytes</b>，線路 <b>${R} Mbps</b>。transmission delay 幾 ms？`,[String(ms)],ms+" ms",`<code>${L} × 8 ÷ ${R},000,000 = ${ms} ms</code>`,{num:true})};
const gProp=()=>{const km=pick([200,1000,2000,4000]),ms=km/200;return F(`距離 <b>${km} km</b>，訊號速度 2×10⁸ m/s。propagation delay 幾 ms？`,[String(ms)],ms+" ms",`<code>${km},000 m ÷ 2×10⁸ m/s = ${ms} ms</code>`,{num:true})};
const gSF=()=>{const r=pick([1,2,3]),L=pick([8000,4000,2000]),R=pick([1,2]),n=r+1,ms=+(n*L/(R*1000)).toFixed(3);return F(`中間有 <b>${r}</b> 台路由器，封包 <b>${L} bits</b>，每段 <b>${R} Mbps</b>。傳完要幾 ms？（不計 propagation 和排隊）`,[String(ms)],ms+" ms",`${n} 段：<code>${n} × ${L} ÷ ${R},000,000 = ${ms} ms</code>`,{num:true})};
const gBottle=()=>{const a=shuffle([pick([100,50,20]),pick([10,5]),pick([2,1,8])]),m=Math.min(...a);return F(`路徑三段依序是 <b>${a.join("、")}</b> Mbps。throughput 最多幾 Mbps？`,[String(m)],m+" Mbps","看最慢的一段。",{num:true})};
const gTdm=()=>{const[R,n]=pick([[4,4],[8,4],[10,5],[6,3],[12,4]]),v=R/n;return F(`TDM：線路 <b>${R} Mbps</b>，一個 frame 有 <b>${n}</b> 個時槽。每條連線分到幾 Mbps？`,[String(v)],v+" Mbps",`<code>${R} ÷ ${n} = ${v}</code>`,{num:true})};
const gSucc=()=>{const P=[1,3,4,5,8,10,12,14],k=pick([0,2,6,7,9,11,13,15]),s=P.find(p=>p>=k)??P[0];return F(`key = <b>${k}</b>，歸哪個 peer？（peer：1、3、4、5、8、10、12、14）`,[String(s)],"Peer "+s,k>14?"比最大的 14 還大，繞回最小的 1。":`第一個大於等於 ${k} 的是 ${s}。`,{num:true})};
const gDist=()=>{const pool=[64,32,16,8];let d,hs,ms;do{d=1025+(Math.random()*2500|0);hs=[];for(let k=11;k>=0;k--)if(d&(1<<k))hs.push(1<<k);ms=pool.filter(x=>!hs.includes(x))}while(ms.length!==1);
  return C(`環上 4096 個 peer，距離是 <b>${d}</b>。哪個<b>不是</b>走過的距離？`,pool.map(String),pool.indexOf(ms[0]),`<code>${d} = ${hs.join(" + ")}</code>`,{keep:true})};
const gHops=()=>{const a=pick([20,100,256,700]),d=pick([513,1034,1300,2049,3000]),b=a+d;let n=0,hs=[];for(let k=11;k>=0;k--)if(d&(1<<k)){n++;hs.push(1<<k)}return F(`環上 4096 個 peer，有 2ᵏ 捷徑。Peer ${a} 查 Peer ${b}，要走幾步？`,[String(n)],n+" 步",`距離 ${d} = ${hs.join(" + ")}，有 ${n} 個 1。`,{num:true})};

/* ---------- Slider generators (Sl): drag a number, watch the result change ---------- */

  {title:"P2P",sub:"第 2 章：大家互相傳",nodes:[
    {title:"Client-server vs P2P",steps:[
      Gd("搞懂為什麼 P2P 人越多也不會越慢（self-scalability）",[
        {q:"伺服器要把 1 GB 的檔案送給 10 個人，伺服器總共要上傳多少？",o:["10 GB","1 GB","0.1 GB","看網速，沒辦法算"],a:0,
         miss:["","每個人都要一整份，伺服器要送 10 份。","這是把 1 GB 分給 10 人，但每個人都要完整檔案。","題目問的是總量，跟速度無關。"],
         why:"每人一份完整檔案：10 × 1 GB。",note:"client-server：伺服器要上傳 N 份"},
        {q:"人數變成 1000 人，伺服器只靠自己上傳，時間會怎樣？",o:["要送 1000 GB，時間跟著人數線性變長","還是一樣快","只多一點點","反而變快"],a:0,
         miss:["","伺服器上傳速度固定，要送的量多了 100 倍。","要送的量變成 100 倍，不會只多一點。","沒有理由變快。"],
         why:"伺服器上傳速度固定，人越多要送越多份。",note:"人越多，client-server 越慢（線性）"},
        {q:"P2P 裡，Alice 下載到檔案的其中一塊後，可以做什麼？",o:["把這塊傳給其他還沒有的 peer","只能自己用","要先還給伺服器","下載完才能分享"],a:0,
         miss:["","P2P 的重點就是每個 peer 也能上傳。","不用經過伺服器，peer 之間直接傳。","拿到一塊就可以分享那一塊，不用等全部下載完。"],
         why:"每個 peer 邊下載、邊把手上的碎片傳給別人。",note:"P2P：每個 peer 邊下載邊上傳"},
        {q:"所以人變多時，P2P 整體的上傳能力會怎樣？",o:["跟著變多，因為新來的 peer 也會上傳","不變，還是只有伺服器在傳","變少","歸零"],a:0,
         miss:["","peer 會互相傳，不是只有伺服器。","新來的人也會貢獻上傳能力，不會變少。","只要還有 peer 在線上，就能繼續傳。"],
         why:"需求（下載的人）和供應（上傳的人）一起增加。",note:"人多 → 上傳能力也多 = self-scalability"}
      ],`<p style="margin:0"><b>client-server</b>：只有伺服器在上傳，人越多越慢。<br><b>P2P</b>：每個 peer 都會上傳，人越多、供應也越多，所以撐得住。這叫 <b>self-scalability</b>。</p>`),
      K("差別",`<p style="margin:0"><b>client-server</b>：全部靠伺服器上傳。<br><b>P2P</b>：每個 peer 下載時也上傳，人越多供應也越多，這叫 <b>self-scalability</b>。</p>`),
      C("使用者暴增時，P2P 比較撐得住，因為？",["新 peer 同時帶來上傳能力","伺服器自動變快","不用 TCP","檔案會變小"],0,"需求和供應一起增加。"),
      F("檔案 100 MB，10 人要下載。伺服器上傳 10 MB/s，只靠伺服器至少幾秒？",["100"],"100 秒","總共要送 1000 MB：<code>1000 ÷ 10 = 100</code>",{num:true}),
      C("P2P 的管理為什麼比較複雜？",["peer 時有時無，IP 還會變","peer 不能上傳","要用 UDP","要買伺服器"],0,"這種來來去去叫 churn。"),
      C("哪個例子是 P2P？",["BitTorrent","瀏覽網頁","Gmail 網頁版","FTP"],0,"HTTP、IMAP、FTP 都是 client-server。"),
      C("server 的特徵是？",["一直開著、IP 固定","時開時關","IP 常變","彼此直接通訊"],0,"後面三個比較像 client 或 peer。"),
      B("每個描述屬於哪一種架構？",["client-server","P2P"],[["永遠開著、IP 固定的伺服器",0],["人越多，分發時間跟著線性變長",0],["Web 瀏覽",0],["人越多，上傳能力也跟著變多",1],["peer 來來去去（churn）",1],["BitTorrent",1]],"P2P 的每個 peer 下載時也上傳，所以有 self-scalability；代價是管理比較複雜。")
    ]},
    {title:"BitTorrent",steps:[
      K("流程",`<ol style="margin:0;padding-left:20px"><li>向 <b>tracker</b> 拿 peer 名單。</li><li>碎片從最少人有的開始要（<b>rarest first</b>）。</li><li>只傳給最快的 <b>4</b> 位，每 <b>10</b> 秒重選。</li><li>每 <b>30</b> 秒隨機挑一位（<b>optimistic unchoke</b>）。</li></ol>`),
      O("新 peer 加入後，依序發生什麼？",["向 tracker 註冊","拿到 peer 名單","連上鄰居","交換碎片"],"一開始手上沒有碎片，要慢慢累積。"),
      C("你有 3 個鄰居，各有不同碎片。依 rarest first，該先要哪個？",["只有 1 人有的碎片","3 人都有的碎片","檔案開頭的碎片","最大的碎片"],0,"稀有碎片先拿，才不會因為對方離開而斷貨。"),
      C("Alice 把上傳名額給誰？",["目前傳給她最快的 4 位","IP 最小的 4 位","最先加入的 4 位","隨機 4 位"],0,"其他人被 choke。"),
      C("某位新 peer 還沒傳過東西給 Alice，他怎麼可能拿到 Alice 的碎片？",["被 optimistic unchoke 選中","向 tracker 申請","付費","不可能"],0,"每 30 秒隨機挑一位。"),
      C("tit-for-tat 想鼓勵什麼？",["多上傳的人下載也快","少下載","用固定 IP","只連 4 個人"],0,"上傳越快，越容易找到好夥伴。"),
      C("Carol 完全不上傳，可能下載完整檔案嗎？",["可能，只是很慢","不可能，一定被踢除","可能，而且最快","要先付費給 tracker"],0,"靠別人的 optimistic unchoke。"),
      C("Carol 用多台不同 IP 的電腦 free-ride，效果呢？",["被選中的機會變多，再合併碎片","完全沒有差別","tracker 會直接封鎖","只會拿到重複碎片"],0,"可以協調各台要不同碎片。")
    ]},
    {title:"DHT",steps:[
      K("規則",`<code class="formula">key 歸 ID 大於等於它的第一個 peer
到底了就繞回最小的 peer</code><p class="small muted" style="margin:0">peer：1、3、4、5、8、10、12、14（ID 範圍 0–15）</p>`),
      G(gSucc),G(gSucc),G(gSucc),
      K("有捷徑時怎麼走",`<code class="formula">距離 = 終點 − 起點
寫成二進位，每個 1 走一步，由大到小</code><p class="small muted" style="margin:0">例：513 = 512 + 1，走 512 再走 1。</p>`),
      G(gDist),G(gDist),G(gHops),G(gHops),
      C("有捷徑的環，查詢訊息數大約是？",["O(log N)","O(N)","O(1)","O(N²)"],0,"每步至少走掉剩餘距離的最高位。"),
      C("為什麼每個 peer 要記<b>兩個</b>後繼者？",["一個離開時還接得上環","加快下載","省記憶體","給 tracker 用"],0,"這是用來處理 peer churn。"),
      C("Peer 5 突然離開，它的前一位 Peer 4 會怎麼做？",["把 8 當新的直接後繼，再問 8 的後繼","重建整個 DHT","通知 tracker","什麼都不做"],0,"投影片的例子。")
    ]}
  ]},

  const cs=getComputedStyle(document.documentElement),cols=["--stamp","--accent","--ok","--warn"].map(v=>cs.getPropertyValue(v).trim()||"#BF3A24");
  const P=Array.from({length:90},()=>({x:r.width/2+(Math.random()-.5)*60,y:r.height*.3,vx:(Math.random()-.5)*10,vy:-Math.random()*10-3,s:5+Math.random()*5,a:Math.random()*6,va:(Math.random()-.5)*.4,c:pick(cols)}));
  let t=0;const step=()=>{x.clearRect(0,0,r.width,r.height);P.forEach(p=>{p.vy+=.3;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.a+=p.va;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/3,p.s,p.s*.6);x.restore()});if(++t<120)requestAnimationFrame(step);else c.remove()};requestAnimationFrame(step)}
function countUp(el,to,suffix,prefix){prefix=prefix||"";if(calm()){el.textContent=prefix+to+suffix;return}const t0=performance.now(),d=700;const f=now=>{const k=Math.min(1,Math.max(0,(now-t0)/d));el.textContent=prefix+Math.round(to*(1-Math.pow(1-k,3)))+suffix;if(k<1)requestAnimationFrame(f)};requestAnimationFrame(f)}

let TAB="path";
function render(){renderStats();if(TAB==="path")renderPath();else if(TAB==="words")renderWords();else renderReview()}

function nextNode(){const st=tState();return topic().allNodes.find(n=>!st.done[n.id])}
function renderPath(){
  const t=topic(),st=tState(),all=t.allNodes,done=all.filter(n=>st.done[n.id]).length,nx=nextNode();
  let h=`<div class="card" style="margin-bottom:16px"><div class="row between"><b>${esc(t.desc)}</b><span class="small muted" style="font-family:var(--mono)">${done}/${all.length} 關</span></div><div class="bar"><i style="width:${all.length?done/all.length*100:0}%"></i></div><div class="row between small"><span class="muted">今日 ${todayXp()} / ${GOAL} XP</span>${Object.keys(st.wrong).length?`<button class="linkbtn" id="goReview" style="min-height:32px">練錯題（${Object.keys(st.wrong).length}）</button>`:""}</div>${t.note?`<div class="small muted">${t.note}</div>`:""}</div>`;
  let i=0;
  t.units.forEach((u,ui)=>{
    h+=`<div class="unit${u.must?" must":""}"><small>UNIT ${ui+1}</small><b>${esc(u.title)}</b><span>${esc(u.sub||"")}</span></div><div class="path">`;
    u.nodes.forEach((n,k)=>{const d=st.done[n.id],cur=n===nx,off=Math.round(Math.sin(k*1.25)*56);i++;
      h+=`<div class="nrow" style="--off:${off}px"><button class="node${n.exam?" exam":""}${d?" done":cur?" cur":""}" data-n="${n.id}" aria-label="${esc(n.title)}${d?"，已過關":""}">${cur?'<span class="bubble">接下來</span>':""}${d?IC.check:i}</button><div class="nlabel">${esc(n.title)}</div>${d?`<div class="nscore">${d}%</div>`:""}</div>`});
    h+="</div>"});
  $("#main").innerHTML=h;

function nodeSheet(id){const n=topic().allNodes.find(x=>x.id===id),d=tState().done[id],c=n.steps.filter(s=>s.k!=="card").length;
  sheet(`<h2>${esc(n.title)}</h2><div class="muted small">${c} 題${n.exam?"・沒有愛心、答錯不重考":"・5 顆愛心，答錯的題目會再考一次"}${d?`・最佳 ${d}%`:""}</div>`,[[d?"再練一次":"開始","",()=>startNode(n)]])}
function sheet(html,acts){const el=$("#sheet");
  el.innerHTML=`<div class="sbg"></div><div class="spanel" role="dialog" aria-modal="true">${html}<div class="sacts">${acts.map((a,i)=>`<button class="btn wide ${a[1]}" data-a="${i}">${a[0]}</button>`).join("")}<button class="btn ghost wide" data-close>關閉</button></div></div>`;
  el.classList.add("on");const close=()=>{el.classList.remove("on");el.innerHTML=""};
  el.querySelector(".sbg").onclick=close;el.querySelector("[data-close]").onclick=close;
  el.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{const f=acts[+b.dataset.a][2];close();f()});

function topicSheet(){
  const el=sheet(`<h2>選主題</h2><div class="stack" id="topicList">${TOPICS.map(t=>{const st=tState(t.id),d=t.allNodes.filter(n=>st.done[n.id]).length;return`<button class="topic-opt${t.id===S.topic?" on":""}" data-t="${t.id}"><b>${esc(t.name)}</b><span class="small muted">${esc(t.desc)}・${d}/${t.allNodes.length} 關</span></button>`}).join("")}</div><div class="small muted">要加新主題，把講義或題庫丟給 Claude，說「加到闖關學習區」。</div>`,[]);

/* ---------- Lesson engine ---------- */
let L=null;
function inst(d){
  const s=d.gen?{...d.gen(),id:d.id,_def:d}:{...d,_def:d};
  if(s.k==="choice"&&!s.keep){const ord=shuffle(s.o.map((_,i)=>i));s.o=ord.map(i=>d.gen?s.o[i]:d.o[i]);s.a=ord.indexOf(s.a)}
  if(s.k==="order")s.bank=shuffle([...s.seq,...(s.extra||[])]);
  if(s.k==="match"){s.l=shuffle(s.pairs.map((p,i)=>({t:p[0],i})));s.r=shuffle(s.pairs.map((p,i)=>({t:p[1],i})))}
  if(s.k==="sort")s.pool=shuffle(s.items.map((_,i)=>i));
  if(s.k==="guide")s.steps=s.steps.map(g=>{const ord=shuffle(g.o.map((_,i)=>i));return{...g,o:ord.map(i=>g.o[i]),miss:ord.map(i=>(g.miss||[])[i]||""),a:ord.indexOf(g.a)}});
  if(s.k==="drag"){const id=s.seq.map((_,i)=>i);let o;do{o=shuffle(id)}while(s.seq.length>1&&o.every((v,i)=>v===i));s.start=o}
  return s;
}
function startLesson(node){
  L={node,queue:node.steps.map(inst),graded:0,hearts:5,right:0,wrong:0,combo:0,exam:!!node.exam,t0:Date.now(),seen:0};
  L.total=L.queue.length;$("#lesson").classList.add("on");next();
}
const startNode=n=>startLesson(n);
function startReview(){const st=tState(),defs=Object.keys(st.wrong).map(i=>NODE_INDEX[i]).filter(Boolean);if(!defs.length)return;startLesson({id:null,title:"練錯題",steps:shuffle(defs).slice(0,15)})}
function startRandom(){const defs=topic().allNodes.flatMap(n=>n.steps).filter(s=>s.k!=="card"&&s.k!=="flash"&&s.k!=="match"&&s.k!=="guide");startLesson({id:null,title:"隨機 10 題",steps:shuffle(defs).slice(0,10)})}
function quit(){$("#lesson").classList.remove("on");$("#lesson").innerHTML="";L=null;render()}
function next(){if(L.step)L.graded++;if(L.hearts<=0)return failed();if(!L.queue.length)return finish();L.step=L.queue.shift();L.state="check";L.sel=null;L.picked=[];L.typed="";L.revealed=false;L.seen++;renderStep()}
function head(){const g=L.graded+(L.state==="cont"?1:0),pct=Math.min(100,g/(L.graded+1+L.queue.length)*100);
  return `<div class="lhead"><button class="x" id="lx" aria-label="離開">${IC.x}</button><div class="pbar" role="progressbar" aria-valuenow="${Math.round(pct)}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div>${L.exam?`<div class="hearts" style="color:var(--muted)">${L.right}/${L.right+L.wrong}</div>`:`<div class="hearts">${IC.heart}${L.hearts}</div>`}</div>`}
const tagLine=s=>(s.tag||s.flag)?`<div class="tag">${s.tag?esc(s.tag):""}${s.flag?'<span class="flag">推論</span>':""}</div>`:"";
function renderStep(){const s=L.step;let body="",btn="檢查",enabled=false;
  if(s.k==="card"){body=`<div class="intro"><div class="ihead">${mascot("idle",40)}<h3>${s.title}</h3></div>${s.html}</div>${askBtn("看不懂這張？問 AI")}`;btn="知道了";enabled=true}
  if(s.k==="guide"){L.gi=0;L.gsel=null;L.gdone=false;L.gwrong=[];
    body=`<div class="goal">${IC.target}<div><span class="small muted">這題的目標</span><br>${s.goal}</div></div><div class="gnotes" id="gn"></div><div class="stack" id="gq"></div>`}
  if(s.k==="choice"){body=`${tagLine(s)}<p class="prompt${s.en?" en":""}">${s.q}</p><div class="opts">${s.o.map((o,i)=>`<button class="opt" data-i="${i}"><span class="k">${s.keep&&s.en?"ABCD"[i]:i+1}</span><span>${o}</span></button>`).join("")}</div>`}
  if(s.k==="fill"){const hint=(s.show||"").replace(/[^\s\-]/g,(c,i,str)=>(i===0||/[\s\-]/.test(str[i-1]))?c:"_");
    body=`${tagLine(s)}<p class="prompt${s.en?" en":""}">${s.q}</p><input class="tinput" id="ti" ${s.num?'inputmode="decimal"':''} autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="輸入答案" placeholder="${s.num?"輸入數字":"輸入答案（寫全名）"}">${s.num?"":`<button class="linkbtn" id="hintBtn">看提示</button><div class="hint" id="hint" hidden>${esc(hint)}</div>`}`}
  if(s.k==="order"){body=`${tagLine(s)}<p class="prompt">${s.q}</p><div class="ansline" id="ansl" aria-label="你排的順序"></div><div class="bank" id="bank">${s.bank.map((t,i)=>`<button class="tile" data-i="${i}">${esc(t)}</button>`).join("")}</div>`}
  if(s.k==="match"){btn="繼續";body=`<p class="prompt">${s.q}</p><div class="match"><div class="mcol">${s.l.map(x=>`<button class="mt" data-side="l" data-i="${x.i}">${esc(x.t)}</button>`).join("")}</div><div class="mcol">${s.r.map(x=>`<button class="mt" data-side="r" data-i="${x.i}">${esc(x.t)}</button>`).join("")}</div></div>`}
  if(s.k==="sort"){L.at=s.items.map(()=>-1);L.ssel=s.pool[0];
    body=`${tagLine(s)}<p class="prompt">${s.q}</p><div class="small muted">點卡片，再點它該去的類別。點類別裡的卡片可以拿回來。</div><div class="pool" id="pool"></div><div class="bks">${s.cats.map((c,b)=>`<div class="bk" id="bk${b}"><button class="bkh" data-b="${b}"><span>${c}</span><span class="bkp">放這裡</span></button><div class="bkc"></div></div>`).join("")}</div>`}
  if(s.k==="drag"){L.ord=s.start.slice();enabled=true;
    body=`${tagLine(s)}<p class="prompt">${s.q}</p><div class="small muted">按住一列上下拖，或用右邊的箭頭移動。</div><div class="drl" id="drl"></div>`}
  if(s.k==="range"){L.val=null;
    body=`${tagLine(s)}<p class="prompt">${s.q}</p><div class="rng"><div class="rv">${s.label?`<span class="small muted">${s.label}</span>`:""}<b id="rvv">${s.init}</b><span>${s.unit||""}</span></div><div class="rrow"><button class="dra rstep" id="rm" aria-label="減少">−</button><input type="range" id="rg" min="${s.min}" max="${s.max}" step="${s.step||1}" value="${s.init}" aria-label="${s.label||"數值"}"><button class="dra rstep" id="rp" aria-label="增加">＋</button></div><div class="rview" id="rview">${s.view(s.init)}</div></div>`}
  if(s.k==="flash"){btn="看參考答案";enabled=true;body=`${tagLine(s)}<p class="prompt en">${s.q}</p><div id="fa"></div>`}
  if(s.ctx&&s.k!=="card"&&s.k!=="guide")body=`<details class="stem" open><summary>題目設定（點一下收合）</summary><div class="sbody">${s.ctx}</div></details>`+body;
  $("#lesson").innerHTML=`<div class="lwrap">${head()}<div class="combo" id="combo">${L.combo>=3?L.combo+" 連對":""}</div><div class="lbody" id="lb">${body}</div><div class="foot" id="foot"><div class="fb" id="fb" hidden></div><button class="btn wide" id="go" ${enabled?"":"disabled"}>${btn}</button></div></div>`;
  $("#lx").onclick=()=>sheet("<h2>要離開這一關嗎？</h2><div class='small muted'>這一關的進度不會保留，錯題本會保留。</div>",[["離開","bad",quit]]);
  $("#go").onclick=onGo;
  if(s.k==="choice")document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>pickOpt(+b.dataset.i));
  if(s.k==="fill"){const ti=$("#ti");ti.oninput=()=>{L.typed=ti.value;$("#go").disabled=!ti.value.trim()};ti.onkeydown=e=>{if(e.key==="Enter"&&L.state==="check"&&ti.value.trim()){e.preventDefault();onGo()}};ti.focus({preventScroll:true});
    const hb=$("#hintBtn");if(hb)hb.onclick=()=>{$("#hint").hidden=false;hb.hidden=true}}
  if(s.k==="order")wireOrder();
  if(s.k==="match")wireMatch();
  if(s.k==="sort")wireSort();
  if(s.k==="drag")drawDrag();
  if(s.k==="range")wireRange();
  if(s.k==="guide")drawGuide();
}
/* ---- guide: small "what do you need / why" questions that build one idea ---- */
function drawGuide(){const s=L.step,g=s.steps[L.gi],n=s.steps.length;
  $("#gn").innerHTML=s.steps.slice(0,L.gi+(L.gdone?1:0)).map(x=>`<div class="gn">${IC.check}<span>${x.note}</span></div>`).join("");
  $("#gq").innerHTML=`<div class="gstep">第 ${L.gi+1} / ${n} 步</div><p class="prompt">${g.q}</p><div class="opts">${g.o.map((o,i)=>{const bad=L.gwrong.includes(i),ok=L.gdone&&i===g.a;
      return `<button class="opt${ok?" ok":bad?" bad":L.gsel===i?" sel":""}" data-g="${i}"${L.gdone||bad?" disabled":""}><span class="k">${i+1}</span><span>${o}</span></button>`}).join("")}</div><div id="gfb"></div>`;
  document.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{if(L.gdone)return;L.gsel=+b.dataset.g;document.querySelectorAll("[data-g]").forEach(x=>x.classList.toggle("sel",+x.dataset.g===L.gsel));$("#go").disabled=false})}
function guideFb(ok,html){const f=$("#gfb");f.innerHTML=`<div class="gfb ${ok?"ok":"bad"}"><b class="t">${ok?"對！":"不是這個，再選一次"}</b><div>${html}</div>${askBtn()}</div>`;f.scrollIntoView({behavior:"smooth",block:"nearest"})}
function guideGo(){const s=L.step,g=s.steps[L.gi],go=$("#go");
  if(L.gdone){if(L.gi<s.steps.length-1){L.gi++;L.gdone=false;L.gsel=null;L.gwrong=[];drawGuide();go.textContent="檢查";go.disabled=true;go.classList.remove("ok","bad");$("#lb").scrollTop=0;return}
    return grade(true,`<b>推導完成</b><br>${s.wrap}`,{noPenalty:true})}
  if(L.gsel==null)return;
  if(L.gsel===g.a){L.gdone=true;sfx.ok();buzz(12);drawGuide();guideFb(true,g.why||"");go.textContent=L.gi<s.steps.length-1?"下一步":"完成推導";go.classList.add("ok");go.disabled=false}
  else{L.gwrong.push(L.gsel);const why=g.miss[L.gsel]||"再想一下這一步要的是什麼。";L.gsel=null;sfx.bad();buzz([40,50,40]);drawGuide();guideFb(false,why);go.disabled=true}}
/* ---- sort: cards into buckets ---- */
function drawSort(){const s=L.step,done=L.state!=="check";

  const ci=$("#ci");ci.oninput=()=>{ci.style.height="auto";ci.style.height=Math.min(ci.scrollHeight,120)+"px"};
  ci.onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey&&!e.isComposing){e.preventDefault();$("#cs").click()}};
  $("#cs").onclick=()=>{if(chatCtl){chatCtl.abort();return}const v=ci.value.trim();if(!v)return;ci.value="";ci.oninput();sendChat(c,v)}}
function drawMsgs(c,live){const m=$("#cm");if(!m)return;
  m.innerHTML=(c.turns.length?"":`<div class="cmsg a">對這題哪裡不懂？直接問，或點下面的問題。</div>`)+c.turns.map(t=>`<div class="cmsg ${t.role==="user"?"u":"a"}${t.err?" err":""}">${t.role==="user"?esc(t.content):md(t.content)}</div>`).join("")+(live!=null?`<div class="cmsg a" id="clive">${live?md(live):"思考中…"}</div>`:"");
  m.scrollTop=m.scrollHeight}
async function sendChat(c,q){if(!AI||chatCtl)return;c.turns=c.turns.filter(t=>!t.err);c.turns.push({role:"user",content:q});drawMsgs(c,"");
  const cs=$("#cs");if(cs)cs.textContent="停止";chatCtl=new AbortController();
  const input=[{role:"user",content:RULES+c.ctx},...c.turns.slice(-12).map(t=>({role:t.role,content:t.content}))];
  try{const{text,truncated}=await AI(input,{cache:false,signal:chatCtl.signal,modelTier:"default",effort:"low",onText:({text})=>{const b=$("#clive");if(b){b.innerHTML=md(text);$("#cm").scrollTop=$("#cm").scrollHeight}}});
    c.turns.push({role:"assistant",content:text+(truncated?"\n（回答太長被截斷了，可以請它說短一點）":"")})}
  catch(e){const code=e&&e.code;if(e&&e.text&&code!=="refused")c.turns.push({role:"assistant",content:e.text});
    if(code!=="cancelled")c.turns.push({role:"assistant",err:1,content:AI_ERR[code]||"連線中斷了，可以再送一次。"});
    if(AI_GONE.includes(code)){AI=null;document.documentElement.classList.remove("ai")}}
  finally{chatCtl=null;const b=$("#cs");if(b)b.textContent="送出";drawMsgs(c)}}

/* keyboard (desktop) */
document.addEventListener("keydown",e=>{if(!L||L.state==="end"||$("#sheet").classList.contains("on")||$("#chat").classList.contains("on")||e.target.tagName==="TEXTAREA")return;
  if(e.target.tagName==="INPUT")return;
  if(L.step&&L.step.k==="choice"&&L.state==="check"&&/^[1-4]$/.test(e.key)){const i=+e.key-1;if(i<L.step.o.length)pickOpt(i)}
  if(e.key==="Enter"&&e.target.tagName!=="BUTTON"){const g=$("#go");if(g&&!g.disabled){e.preventDefault();onGo()}}
});
render();
cloudInit();
</script>
